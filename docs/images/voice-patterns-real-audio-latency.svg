<svg xmlns="http://www.w3.org/2000/svg" width="1280" height="855" viewBox="0 0 1280 855" role="img" aria-labelledby="title desc">
  <title id="title">How long after the caller stops does the agent start speaking</title>
  <desc id="desc">A caller-focused latency chart measured from the end of caller speech to first response audio, including a 500 millisecond silence wait. It compares three earlier voice patterns and three first-class Foundry voice-agent configurations over 50 turns each.</desc>
  <defs>
    <style>
      .title { font: 700 30px "Segoe UI", sans-serif; fill: #111; }
      .subtitle { font: 18px "Segoe UI", sans-serif; fill: #333; }
      .group { font: 700 18px "Segoe UI", sans-serif; fill: #111; }
      .row-title { font: 600 18px "Segoe UI", sans-serif; fill: #111; }
      .row-detail { font: 17px "Segoe UI", sans-serif; fill: #444; }
      .axis { font: 16px "Segoe UI", sans-serif; fill: #444; }
      .value { font: 600 16px "Segoe UI", sans-serif; fill: #111; }
      .grid { stroke: #E1DFDD; stroke-width: 1; }
      .baseline { stroke: #605E5C; stroke-width: 1.5; }
      .tail { stroke-width: 4; stroke-linecap: round; }
      .median { stroke-width: 16; stroke-linecap: round; }
      .endpoint { fill: #fff; stroke-width: 3; }
    </style>
  </defs>

  <rect width="1280" height="855" fill="#fff"/>
  <text x="640" y="42" text-anchor="middle" class="title">How long after the caller stops does the agent start speaking?</text>
  <text x="640" y="75" text-anchor="middle" class="subtitle">Includes the 500 ms silence wait · 50 measured turns per configuration · lower is better</text>

  <line x1="355" y1="115" x2="415" y2="115" stroke="#0078D4" class="median"/>
  <text x="435" y="121" class="subtitle">Typical turn</text>
  <line x1="585" y1="115" x2="645" y2="115" stroke="#605E5C" class="tail"/>
  <circle cx="645" cy="115" r="7" class="endpoint" stroke="#605E5C"/>
  <text x="665" y="121" class="subtitle">95% of turns started by this time</text>

  <rect x="55" y="155" width="1170" height="300" rx="14" fill="none" stroke="#0078D4" stroke-width="2"/>
  <rect x="55" y="475" width="1170" height="300" rx="14" fill="none" stroke="#5C2D91" stroke-width="2"/>
  <text x="80" y="187" class="group">Earlier patterns</text>
  <text x="80" y="507" class="group">First-class Foundry voice-agent feature</text>

  <g>
    <line x1="450" y1="195" x2="450" y2="805" class="grid"/>
    <line x1="550" y1="195" x2="550" y2="805" class="grid"/>
    <line x1="650" y1="195" x2="650" y2="805" class="grid"/>
    <line x1="750" y1="195" x2="750" y2="805" class="grid"/>
    <line x1="850" y1="195" x2="850" y2="805" class="grid"/>
    <line x1="950" y1="195" x2="950" y2="805" class="grid"/>
    <line x1="1050" y1="195" x2="1050" y2="805" class="grid"/>
    <line x1="450" y1="805" x2="1050" y2="805" class="baseline"/>
    <text x="450" y="835" text-anchor="middle" class="axis">0</text>
    <text x="550" y="835" text-anchor="middle" class="axis">1</text>
    <text x="650" y="835" text-anchor="middle" class="axis">2</text>
    <text x="750" y="835" text-anchor="middle" class="axis">3</text>
    <text x="850" y="835" text-anchor="middle" class="axis">4</text>
    <text x="950" y="835" text-anchor="middle" class="axis">5</text>
    <text x="1050" y="835" text-anchor="middle" class="axis">6 seconds</text>
  </g>

  <g>
    <text x="80" y="235" class="row-title">Realtime API direct</text>
    <text x="80" y="258" class="row-detail">GPT Realtime 1.5 · model-native voice</text>
    <text x="80" y="320" class="row-title">Voice Live + your model</text>
    <text x="80" y="343" class="row-detail">GPT Realtime 1.5 · Azure neural voice</text>
    <text x="80" y="405" class="row-title">Voice Live + prompt agent</text>
    <text x="80" y="428" class="row-detail">GPT-4o mini · cascaded</text>

    <text x="80" y="555" class="row-title">Managed speech-to-speech</text>
    <text x="80" y="578" class="row-detail">GPT Realtime 2.1</text>
    <text x="80" y="640" class="row-title">Cascaded · fast text model</text>
    <text x="80" y="663" class="row-detail">GPT-4o mini</text>
    <text x="80" y="725" class="row-title">Cascaded · reasoning model</text>
    <text x="80" y="748" class="row-detail">GPT-5</text>
  </g>

  <g>
    <line x1="450" y1="245" x2="553" y2="245" stroke="#0078D4" class="median"/>
    <line x1="553" y1="245" x2="560" y2="245" stroke="#0078D4" class="tail"/>
    <circle cx="560" cy="245" r="7" class="endpoint" stroke="#0078D4"/>
    <text x="575" y="227" class="value">1.03 s · 95% by 1.10 s</text>

    <line x1="450" y1="330" x2="574" y2="330" stroke="#0C8599" class="median"/>
    <line x1="574" y1="330" x2="593" y2="330" stroke="#0C8599" class="tail"/>
    <circle cx="593" cy="330" r="7" class="endpoint" stroke="#0C8599"/>
    <text x="608" y="312" class="value">1.24 s · 95% by 1.43 s</text>

    <line x1="450" y1="415" x2="640" y2="415" stroke="#F7630C" class="median"/>
    <line x1="640" y1="415" x2="687" y2="415" stroke="#F7630C" class="tail"/>
    <circle cx="687" cy="415" r="7" class="endpoint" stroke="#F7630C"/>
    <text x="702" y="397" class="value">1.90 s · 95% by 2.37 s</text>

    <line x1="450" y1="565" x2="597" y2="565" stroke="#5C2D91" class="median"/>
    <line x1="597" y1="565" x2="611" y2="565" stroke="#5C2D91" class="tail"/>
    <circle cx="611" cy="565" r="7" class="endpoint" stroke="#5C2D91"/>
    <text x="626" y="547" class="value">1.47 s · 95% by 1.61 s</text>

    <line x1="450" y1="650" x2="581" y2="650" stroke="#107C10" class="median"/>
    <line x1="581" y1="650" x2="602" y2="650" stroke="#107C10" class="tail"/>
    <circle cx="602" cy="650" r="7" class="endpoint" stroke="#107C10"/>
    <text x="617" y="632" class="value">1.31 s · 95% by 1.52 s</text>

    <line x1="450" y1="735" x2="795" y2="735" stroke="#495057" class="median"/>
    <line x1="795" y1="735" x2="982" y2="735" stroke="#495057" class="tail"/>
    <circle cx="982" cy="735" r="7" class="endpoint" stroke="#495057"/>
    <text x="997" y="717" class="value">3.45 s · 95% by 5.32 s</text>
  </g>
</svg>
