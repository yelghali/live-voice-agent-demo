<svg xmlns="http://www.w3.org/2000/svg" width="1400" height="620" viewBox="0 0 1400 620" role="img" aria-labelledby="title desc">
  <title id="title">Voice Live with a Microsoft Foundry prompt agent</title>
  <desc id="desc">An authenticated client connects through an application edge and Voice Live to a configuration-defined Foundry prompt agent. The agent selects a chat deployment and reaches retrieval and tools through project connections.</desc>
  <defs>
    <linearGradient id="bg" x1="0" y1="0" x2="1" y2="1">
      <stop offset="0" stop-color="#f7f5ff"/>
      <stop offset="0.55" stop-color="#f7fbff"/>
      <stop offset="1" stop-color="#f2fbf7"/>
    </linearGradient>
    <linearGradient id="voice" x1="0" y1="0" x2="1" y2="1">
      <stop offset="0" stop-color="#7357e5"/>
      <stop offset="1" stop-color="#9b78f2"/>
    </linearGradient>
    <linearGradient id="foundry" x1="0" y1="0" x2="1" y2="1">
      <stop offset="0" stop-color="#0f6cbd"/>
      <stop offset="1" stop-color="#3a96dd"/>
    </linearGradient>
    <linearGradient id="data" x1="0" y1="0" x2="1" y2="1">
      <stop offset="0" stop-color="#0f7b5f"/>
      <stop offset="1" stop-color="#30a679"/>
    </linearGradient>
    <filter id="shadow" x="-20%" y="-20%" width="140%" height="150%">
      <feDropShadow dx="0" dy="8" stdDeviation="12" flood-color="#17324d" flood-opacity="0.12"/>
    </filter>
    <marker id="arrowBlue" viewBox="0 0 10 10" refX="9" refY="5" markerWidth="8" markerHeight="8" orient="auto">
      <path d="M0 0 10 5 0 10z" fill="#3978d4"/>
    </marker>
    <marker id="arrowGreen" viewBox="0 0 10 10" refX="9" refY="5" markerWidth="8" markerHeight="8" orient="auto">
      <path d="M0 0 10 5 0 10z" fill="#168466"/>
    </marker>
    <style>
      .title{font:700 31px 'Segoe UI',Arial,sans-serif;fill:#132238}
      .sub{font:15px 'Segoe UI',Arial,sans-serif;fill:#4b6178}
      .eyebrow{font:700 12px 'Segoe UI',Arial,sans-serif;letter-spacing:1.3px;fill:#6745d2}
      .zone{font:700 12px 'Segoe UI',Arial,sans-serif;letter-spacing:1px;fill:#597088}
      .cardTitle{font:700 18px 'Segoe UI',Arial,sans-serif;fill:#132238}
      .cardBody{font:14px 'Segoe UI',Arial,sans-serif;fill:#40566d}
      .whiteTitle{font:700 18px 'Segoe UI',Arial,sans-serif;fill:#fff}
      .whiteBody{font:14px 'Segoe UI',Arial,sans-serif;fill:#eef6ff}
      .label{font:600 12px 'Segoe UI',Arial,sans-serif;fill:#486078}
      .foot{font:600 14px 'Segoe UI',Arial,sans-serif;fill:#18364f}
      .pill{font:700 11px 'Segoe UI',Arial,sans-serif;letter-spacing:.7px;fill:#fff}
    </style>
  </defs>

  <rect width="1400" height="620" fill="url(#bg)"/>
  <circle cx="1305" cy="48" r="95" fill="#8064e8" opacity=".08"/>
  <circle cx="1235" cy="16" r="48" fill="#35a87b" opacity=".08"/>

  <text x="56" y="42" class="eyebrow">PATTERN 3 · VOICE LIVE + AGENT SERVICE</text>
  <text x="56" y="82" class="title">Voice Live + a Microsoft Foundry prompt agent</text>
  <text x="56" y="112" class="sub">Tested with a configuration-defined PromptAgentDefinition. Hosted agents were not tested.</text>

  <rect x="282" y="146" width="260" height="374" rx="24" fill="#fff" opacity=".62" stroke="#83cfb7" stroke-width="1.5" stroke-dasharray="7 7"/>
  <rect x="570" y="146" width="774" height="374" rx="24" fill="#fff" opacity=".72" stroke="#b9c9df" stroke-width="1.5" stroke-dasharray="7 7"/>
  <text x="56" y="172" class="zone">CLIENT</text>
  <text x="306" y="172" class="zone">YOUR APPLICATION</text>
  <text x="594" y="172" class="zone">MICROSOFT FOUNDRY MANAGED BOUNDARY</text>

  <g filter="url(#shadow)">
    <rect x="56" y="220" width="200" height="154" rx="20" fill="#fff" stroke="#c9d6e5" stroke-width="1.5"/>
    <circle cx="92" cy="258" r="17" fill="#eaf1fb"/>
    <circle cx="92" cy="253" r="6" fill="#3978d4"/>
    <path d="M81 270c4-8 18-8 22 0" fill="none" stroke="#3978d4" stroke-width="3" stroke-linecap="round"/>
    <text x="120" y="255" class="cardTitle">Authenticated</text>
    <text x="120" y="277" class="cardTitle">client</text>
    <text x="80" y="310" class="cardBody">Browser or native app</text>
    <text x="80" y="333" class="cardBody">Audio + app session</text>
    <text x="80" y="356" class="cardBody">No Azure credentials</text>
  </g>

  <g filter="url(#shadow)">
    <rect x="310" y="210" width="204" height="174" rx="20" fill="url(#data)"/>
    <rect x="332" y="232" width="86" height="24" rx="12" fill="#fff" opacity=".18"/>
    <text x="375" y="248" text-anchor="middle" class="pill">APP HANDLES</text>
    <text x="334" y="290" class="whiteTitle">Application edge</text>
    <text x="334" y="318" class="whiteBody">User authentication</text>
    <text x="334" y="342" class="whiteBody">Session admission + policy</text>
    <text x="334" y="366" class="whiteBody">WebSocket proxy / broker</text>
  </g>

  <g filter="url(#shadow)">
    <rect x="600" y="220" width="190" height="154" rx="20" fill="url(#voice)"/>
    <rect x="620" y="240" width="74" height="24" rx="12" fill="#fff" opacity=".18"/>
    <text x="657" y="256" text-anchor="middle" class="pill">VOICE</text>
    <text x="624" y="296" class="whiteTitle">Voice Live</text>
    <text x="624" y="324" class="whiteBody">Speech to text + TTS</text>
    <text x="624" y="348" class="whiteBody">VAD + barge-in</text>
  </g>

  <g filter="url(#shadow)">
    <rect x="828" y="210" width="245" height="174" rx="20" fill="url(#foundry)"/>
    <rect x="850" y="232" width="118" height="24" rx="12" fill="#fff" opacity=".18"/>
    <text x="909" y="248" text-anchor="middle" class="pill">PROMPT AGENT</text>
    <text x="852" y="290" class="whiteTitle">Foundry Agent Service</text>
    <text x="852" y="318" class="whiteBody">Instructions + tool selection</text>
    <text x="852" y="342" class="whiteBody">Threads + tracing + approval</text>
    <text x="852" y="366" class="whiteBody">Managed tool loop</text>
  </g>

  <g filter="url(#shadow)">
    <rect x="1110" y="220" width="230" height="154" rx="20" fill="#fff" stroke="#6aa9df" stroke-width="2"/>
    <rect x="1132" y="240" width="126" height="24" rx="12" fill="#e7f3fd"/>
    <text x="1195" y="256" text-anchor="middle" class="label">CHAT DEPLOYMENT</text>
    <text x="1134" y="296" class="cardTitle">Model inference</text>
    <text x="1134" y="324" class="cardBody">Chosen on the agent</text>
    <text x="1134" y="348" class="cardBody">SKU controls residency</text>
  </g>

  <path d="M256 297H310" stroke="#3978d4" stroke-width="3" fill="none" marker-end="url(#arrowBlue)"/>
  <path d="M514 297H600" stroke="#3978d4" stroke-width="3" fill="none" marker-end="url(#arrowBlue)"/>
  <path d="M790 297H828" stroke="#3978d4" stroke-width="3" fill="none" marker-end="url(#arrowBlue)"/>
  <path d="M1073 297H1110" stroke="#3978d4" stroke-width="3" fill="none" marker-end="url(#arrowBlue)"/>
  <text x="272" y="285" text-anchor="middle" class="label">app session</text>
  <text x="557" y="285" text-anchor="middle" class="label">WSS</text>
  <text x="809" y="285" text-anchor="middle" class="label">agent</text>
  <text x="1092" y="285" text-anchor="middle" class="label">text</text>

  <g filter="url(#shadow)">
    <rect x="828" y="422" width="245" height="72" rx="16" fill="#edf9f4" stroke="#4dad88" stroke-width="1.5"/>
    <text x="852" y="451" class="cardTitle">Grounding</text>
    <text x="852" y="476" class="cardBody">File Search / AI Search</text>
  </g>
  <g filter="url(#shadow)">
    <rect x="1110" y="422" width="230" height="72" rx="16" fill="#edf9f4" stroke="#4dad88" stroke-width="1.5"/>
    <text x="1134" y="451" class="cardTitle">Enterprise tools</text>
    <text x="1134" y="476" class="cardBody">Project connections</text>
  </g>
  <path d="M950 384V422" stroke="#168466" stroke-width="3" fill="none" marker-end="url(#arrowGreen)"/>
  <path d="M1016 384C1035 404 1188 395 1225 422" stroke="#168466" stroke-width="3" fill="none" marker-end="url(#arrowGreen)"/>

  <rect x="56" y="552" width="1288" height="42" rx="13" fill="#eef4ff" stroke="#c8d8ef"/>
  <text x="78" y="578" class="foot">Best fit: managed retrieval, tools, threads, and tracing matter more than a speech-native model path.</text>
</svg>
