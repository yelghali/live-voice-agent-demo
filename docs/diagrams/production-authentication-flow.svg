<svg xmlns="http://www.w3.org/2000/svg" width="1200" height="620" viewBox="0 0 1200 620" role="img" aria-labelledby="title desc"><title id="title">Authentication flow for a production voice agent</title><desc id="desc">The user authenticates to the application with Entra ID. The backend authorizes the session and uses managed identity to access the voice service, model, retrieval, and tools.</desc><style>.t{font:700 26px Arial;fill:#102a43}.s{font:15px Arial;fill:#486581}.h{font:700 15px Arial;fill:#102a43}.b{font:13px Arial;fill:#243b53}.a{fill:#fff;stroke:#d9e2ec;stroke-width:2}.p{fill:#ecfdf3;stroke:#23a566;stroke-width:2}.c{fill:#eef5ff;stroke:#3578e5;stroke-width:2}.r{fill:#fff4e5;stroke:#e68a00;stroke-width:2}.l{stroke:#3578e5;stroke-width:2.5;fill:none;marker-end:url(#ab)}.g{stroke:#23a566;stroke-width:2.5;fill:none;marker-end:url(#ag)}.d{stroke:#e68a00;stroke-width:2.5;stroke-dasharray:8 6;fill:none;marker-end:url(#ar)}.n{font:12px Arial;fill:#486581}</style><defs><marker id="ab" viewBox="0 0 10 10" refX="9" refY="5" markerWidth="7" markerHeight="7" orient="auto"><path d="M0 0 10 5 0 10z" fill="#3578e5"/></marker><marker id="ag" viewBox="0 0 10 10" refX="9" refY="5" markerWidth="7" markerHeight="7" orient="auto"><path d="M0 0 10 5 0 10z" fill="#23a566"/></marker><marker id="ar" viewBox="0 0 10 10" refX="9" refY="5" markerWidth="7" markerHeight="7" orient="auto"><path d="M0 0 10 5 0 10z" fill="#e68a00"/></marker></defs><rect width="1200" height="620" fill="#f8fbff"/><text x="40" y="48" class="t">One user session, several authentication decisions</text><text x="40" y="76" class="s">User authentication and workload authentication are different controls. Keep service credentials behind the backend.</text><rect x="40" y="112" width="1120" height="390" rx="18" fill="#f7fbff" stroke="#b7d5f5" stroke-width="2" stroke-dasharray="7 6"/><text x="62" y="143" class="h">Enterprise application boundary</text><rect x="72" y="190" width="150" height="76" rx="10" class="a"/><text x="97" y="222" class="h">User</text><text x="97" y="246" class="b">browser session</text><rect x="290" y="174" width="180" height="108" rx="10" class="c"/><text x="320" y="210" class="h">Entra ID</text><text x="320" y="234" class="b">user token</text><text x="320" y="256" class="b">tenant + roles</text><rect x="540" y="174" width="210" height="108" rx="10" class="p"/><text x="565" y="210" class="h">Application backend</text><text x="565" y="234" class="b">session + policy</text><text x="565" y="256" class="b">managed identity</text><path d="M222 228h68" class="l"/><path d="M470 228h70" class="l"/><text x="230" y="212" class="n">1. sign in</text><text x="477" y="212" class="n">2. authorize</text><rect x="820" y="150" width="260" height="76" rx="10" class="c"/><text x="848" y="182" class="h">Voice / model service</text><text x="848" y="206" class="b">workload token or scoped key</text><rect x="820" y="260" width="260" height="76" rx="10" class="p"/><text x="848" y="292" class="h">RAG + private data</text><text x="848" y="316" class="b">managed identity + private path</text><rect x="820" y="370" width="260" height="76" rx="10" class="p"/><text x="848" y="402" class="h">Tools / enterprise APIs</text><text x="848" y="426" class="b">user policy + workload identity</text><path d="M750 202h70" class="d"/><path d="M750 282h70" class="g"/><path d="M750 362h70" class="g"/><text x="758" y="190" class="n">3. service auth</text><text x="758" y="270" class="n">4. data auth</text><text x="758" y="350" class="n">5. action auth</text><rect x="72" y="530" width="1008" height="54" rx="10" class="r"/><text x="96" y="563" class="b">The backend must enforce user authorization before a tool call; a managed identity alone is not user authorization.</text></svg>