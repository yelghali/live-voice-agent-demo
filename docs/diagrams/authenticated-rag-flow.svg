<svg xmlns="http://www.w3.org/2000/svg" width="1400" height="650" viewBox="0 0 1400 650" role="img" aria-labelledby="title desc">
  <title id="title">Authenticated RAG authorizes retrieval before grounding</title>
  <desc id="desc">A signed-in user's identity and document entitlements are applied by the retrieval executor before private knowledge is returned as authorized model context.</desc>
  <defs>
    <linearGradient id="bg" x1="0" y1="0" x2="1" y2="1">
      <stop offset="0" stop-color="#f7fbff"/>
      <stop offset="1" stop-color="#f4fbf8"/>
    </linearGradient>
    <filter id="shadow" x="-20%" y="-20%" width="140%" height="150%">
      <feDropShadow dx="0" dy="7" stdDeviation="10" flood-color="#17324d" flood-opacity=".12"/>
    </filter>
    <marker id="arrowBlue" viewBox="0 0 10 10" refX="9" refY="5" markerWidth="8" markerHeight="8" orient="auto">
      <path d="M0 0 10 5 0 10z" fill="#3978d4"/>
    </marker>
    <marker id="arrowGreen" viewBox="0 0 10 10" refX="9" refY="5" markerWidth="8" markerHeight="8" orient="auto">
      <path d="M0 0 10 5 0 10z" fill="#168466"/>
    </marker>
    <style>
      .title{font:700 31px 'Segoe UI',Arial,sans-serif;fill:#132238}
      .sub{font:15px 'Segoe UI',Arial,sans-serif;fill:#4b6178}
      .step{font:700 11px 'Segoe UI',Arial,sans-serif;letter-spacing:.8px;fill:#536981}
      .cardTitle{font:700 18px 'Segoe UI',Arial,sans-serif;fill:#132238}
      .body{font:14px 'Segoe UI',Arial,sans-serif;fill:#40566d}
      .label{font:600 12px 'Segoe UI',Arial,sans-serif;fill:#486078}
      .ruleTitle{font:700 14px 'Segoe UI',Arial,sans-serif;fill:#9b2529}
      .rule{font:600 15px 'Segoe UI',Arial,sans-serif;fill:#4d2d2f}
    </style>
  </defs>

  <rect width="1400" height="650" fill="url(#bg)"/>
  <circle cx="1320" cy="25" r="105" fill="#7357e5" opacity=".06"/>
  <text x="56" y="52" class="title">Authenticated RAG: authorize before grounding</text>
  <text x="56" y="82" class="sub">The model should receive only the context that the signed-in user is allowed to see.</text>

  <g filter="url(#shadow)">
    <rect x="56" y="190" width="220" height="150" rx="20" fill="#e8f3fd" stroke="#5ba3dd" stroke-width="2"/>
    <text x="80" y="222" class="step">1 · CALLER</text>
    <text x="80" y="258" class="cardTitle">Signed-in user</text>
    <text x="80" y="288" class="body">Identity token</text>
    <text x="80" y="313" class="body">Groups and claims</text>
  </g>

  <g filter="url(#shadow)">
    <rect x="326" y="190" width="240" height="150" rx="20" fill="#fff5dd" stroke="#e5a23c" stroke-width="2"/>
    <text x="350" y="222" class="step">2 · POLICY</text>
    <text x="350" y="258" class="cardTitle">Entitlements</text>
    <text x="350" y="288" class="body">Tenant and role</text>
    <text x="350" y="313" class="body">Document access</text>
  </g>

  <g filter="url(#shadow)">
    <rect x="616" y="165" width="320" height="200" rx="20" fill="#f1eafd" stroke="#8561bc" stroke-width="2"/>
    <text x="640" y="197" class="step">3 · RETRIEVAL EXECUTOR</text>
    <text x="640" y="233" class="cardTitle">Who performs the query?</text>
    <text x="640" y="270" class="body">Prompt agent · project connection</text>
    <text x="640" y="298" class="body">BYOM / direct · backend identity</text>
    <text x="640" y="333" class="label">Apply caller policy before returning text</text>
  </g>

  <g filter="url(#shadow)">
    <rect x="986" y="190" width="300" height="150" rx="20" fill="#e9f8f1" stroke="#4dad88" stroke-width="2"/>
    <text x="1010" y="222" class="step">4 · PRIVATE KNOWLEDGE</text>
    <text x="1010" y="258" class="cardTitle">Search / vector store</text>
    <text x="1010" y="288" class="body">Security-trimmed query</text>
    <text x="1010" y="313" class="body">Private network where required</text>
  </g>

  <path d="M276 265H326" stroke="#3978d4" stroke-width="3" fill="none" marker-end="url(#arrowBlue)"/>
  <path d="M566 265H616" stroke="#3978d4" stroke-width="3" fill="none" marker-end="url(#arrowBlue)"/>
  <path d="M936 240H986" stroke="#168466" stroke-width="3" fill="none" marker-end="url(#arrowGreen)"/>

  <g filter="url(#shadow)">
    <rect x="616" y="445" width="320" height="105" rx="18" fill="#e6f7fb" stroke="#42a4bd" stroke-width="2"/>
    <text x="640" y="478" class="step">5 · MODEL CONTEXT</text>
    <text x="640" y="514" class="cardTitle">Authorized text only</text>
  </g>
  <path d="M1110 340C1110 405 936 395 876 445" stroke="#168466" stroke-width="3" fill="none" marker-end="url(#arrowGreen)"/>
  <text x="1018" y="402" class="label">filtered results</text>

  <g filter="url(#shadow)">
    <rect x="56" y="445" width="510" height="105" rx="18" fill="#fdecee" stroke="#d65a5e" stroke-width="2"/>
    <text x="80" y="478" class="ruleTitle">ARCHITECTURE RULE</text>
    <text x="80" y="514" class="rule">Authorize before any document text reaches the model.</text>
  </g>

  <rect x="56" y="590" width="1230" height="38" rx="12" fill="#eef4ff" stroke="#c8d8ef"/>
  <text x="78" y="614" class="label">A workload identity may access the index; the signed-in user still needs document-level authorization.</text>
</svg>
