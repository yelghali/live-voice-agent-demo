<svg xmlns="http://www.w3.org/2000/svg" width="1200" height="620" viewBox="0 0 1200 620" role="img" aria-labelledby="title desc"><title id="title">Enterprise integration surfaces for a voice agent</title><desc id="desc">A production voice agent connects to model, retrieval, tools, identity, networking, observability, and governance surfaces. Each surface has separate residency and operational considerations.</desc><style>.t{font:700 26px Arial;fill:#102a43}.s{font:15px Arial;fill:#486581}.h{font:700 15px Arial;fill:#102a43}.b{font:13px Arial;fill:#243b53}.a{fill:#fff;stroke:#d9e2ec;stroke-width:2}.p{fill:#ecfdf3;stroke:#23a566;stroke-width:2}.c{fill:#eef5ff;stroke:#3578e5;stroke-width:2}.r{fill:#fff4e5;stroke:#e68a00;stroke-width:2}.l{stroke:#3578e5;stroke-width:2.5;fill:none;marker-end:url(#ab)}.g{stroke:#23a566;stroke-width:2.5;fill:none;marker-end:url(#ag)}.d{stroke:#e68a00;stroke-width:2.5;stroke-dasharray:8 6;fill:none;marker-end:url(#ar)}</style><defs><marker id="ab" viewBox="0 0 10 10" refX="9" refY="5" markerWidth="7" markerHeight="7" orient="auto"><path d="M0 0 10 5 0 10z" fill="#3578e5"/></marker><marker id="ag" viewBox="0 0 10 10" refX="9" refY="5" markerWidth="7" markerHeight="7" orient="auto"><path d="M0 0 10 5 0 10z" fill="#23a566"/></marker><marker id="ar" viewBox="0 0 10 10" refX="9" refY="5" markerWidth="7" markerHeight="7" orient="auto"><path d="M0 0 10 5 0 10z" fill="#e68a00"/></marker></defs><rect width="1200" height="620" fill="#f8fbff"/><text x="40" y="48" class="t">The production voice agent is an integration surface</text><text x="40" y="76" class="s">Choose a deployment option, then design each surrounding enterprise dependency explicitly.</text><rect x="470" y="230" width="260" height="120" rx="14" class="c"/><text x="522" y="270" class="h">Voice agent app</text><text x="522" y="296" class="b">session + policy</text><text x="522" y="320" class="b">model + tools + audio</text><rect x="70" y="140" width="220" height="76" rx="10" class="a"/><text x="96" y="172" class="h">Identity</text><text x="96" y="196" class="b">Entra ID, RBAC, policy</text><rect x="340" y="100" width="220" height="76" rx="10" class="c"/><text x="366" y="132" class="h">Model + voice</text><text x="366" y="156" class="b">SKU, region, audio</text><rect x="640" y="100" width="220" height="76" rx="10" class="p"/><text x="666" y="132" class="h">RAG + storage</text><text x="666" y="156" class="b">private data, grounding</text><rect x="910" y="140" width="220" height="76" rx="10" class="p"/><text x="936" y="172" class="h">Tools + APIs</text><text x="936" y="196" class="b">MCP, actions, approvals</text><rect x="70" y="410" width="220" height="76" rx="10" class="r"/><text x="96" y="442" class="h">Network</text><text x="96" y="466" class="b">private endpoints, egress</text><rect x="340" y="450" width="220" height="76" rx="10" class="a"/><text x="366" y="482" class="h">Observability</text><text x="366" y="506" class="b">traces, logs, cost</text><rect x="640" y="450" width="220" height="76" rx="10" class="a"/><text x="666" y="482" class="h">Governance</text><text x="666" y="506" class="b">retention, redaction, audit</text><rect x="910" y="410" width="220" height="76" rx="10" class="r"/><text x="936" y="442" class="h">Resilience</text><text x="936" y="466" class="b">quotas, failover, recovery</text><path d="M290 178 470 245" class="l"/><path d="M450 176 520 230" class="l"/><path d="M750 176 680 230" class="g"/><path d="M910 178 730 245" class="g"/><path d="M290 440 470 330" class="d"/><path d="M450 450 540 350" class="l"/><path d="M750 450 660 350" class="l"/><path d="M910 440 730 330" class="d"/><text x="40" y="580" class="s">For every surface, document owner, credential, network path, residency, retention, and failure behavior.</text></svg>