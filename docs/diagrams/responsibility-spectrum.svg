<svg xmlns="http://www.w3.org/2000/svg" width="1200" height="520" viewBox="0 0 1200 520" role="img" aria-labelledby="title desc"><title id="title">Responsibility spectrum across the three voice patterns</title><desc id="desc">The three patterns form a spectrum. The application handles more responsibilities on the left with a direct Realtime API integration, the middle is Voice Live with your model deployment, and Microsoft services handle more on the right with Voice Live and a Foundry prompt agent.</desc><style>.t{font:700 26px Arial;fill:#102a43}.s{font:15px Arial;fill:#486581}.h{font:700 17px Arial;fill:#102a43}.b{font:13px Arial;fill:#243b53}.e{font:700 14px Arial;fill:#486581}.c{fill:#eef5ff;stroke:#3578e5;stroke-width:2}.m{fill:#f4f2ff;stroke:#7c5cd6;stroke-width:2}.r{fill:#fff4e5;stroke:#e68a00;stroke-width:2}</style><defs><linearGradient id="sp" x1="0" y1="0" x2="1" y2="0"><stop offset="0" stop-color="#e68a00"/><stop offset="0.5" stop-color="#7c5cd6"/><stop offset="1" stop-color="#3578e5"/></linearGradient><marker id="al" viewBox="0 0 10 10" refX="9" refY="5" markerWidth="7" markerHeight="7" orient="auto"><path d="M0 0 10 5 0 10z" fill="#e68a00"/></marker><marker id="ar" viewBox="0 0 10 10" refX="9" refY="5" markerWidth="7" markerHeight="7" orient="auto"><path d="M0 0 10 5 0 10z" fill="#3578e5"/></marker></defs><rect width="1200" height="520" fill="#f8fbff"/><text x="40" y="48" class="t">The patterns form a spectrum</text><text x="40" y="76" class="s">The application handles more responsibilities on the left; Microsoft services handle more on the right.</text><rect x="60" y="120" width="330" height="132" rx="14" class="r"/><text x="86" y="156" class="h">Realtime API direct</text><text x="86" y="184" class="b">Your application runs the whole</text><text x="86" y="206" class="b">conversation runtime, retrieval,</text><text x="86" y="228" class="b">policy, and tools.</text><rect x="435" y="120" width="330" height="132" rx="14" class="m"/><text x="461" y="156" class="h">Voice Live + BYOM</text><text x="461" y="184" class="b">Voice Live runs the speech session.</text><text x="461" y="206" class="b">Your application runs retrieval,</text><text x="461" y="228" class="b">policy, and tools.</text><rect x="810" y="120" width="330" height="132" rx="14" class="c"/><text x="836" y="156" class="h">Voice Live + prompt agent</text><text x="836" y="184" class="b">Voice Live runs the speech session.</text><text x="836" y="206" class="b">Agent Service runs instructions,</text><text x="836" y="228" class="b">retrieval, and tools.</text><path d="M225 252 225 300" stroke="#e68a00" stroke-width="2.5" fill="none"/><path d="M600 252 600 300" stroke="#7c5cd6" stroke-width="2.5" fill="none"/><path d="M975 252 975 300" stroke="#3578e5" stroke-width="2.5" fill="none"/><rect x="60" y="300" width="1080" height="26" rx="13" fill="url(#sp)"/><circle cx="225" cy="313" r="9" fill="#fff" stroke="#e68a00" stroke-width="3"/><circle cx="600" cy="313" r="9" fill="#fff" stroke="#7c5cd6" stroke-width="3"/><circle cx="975" cy="313" r="9" fill="#fff" stroke="#3578e5" stroke-width="3"/><path d="M330 362 70 362" stroke="#e68a00" stroke-width="2.5" fill="none" marker-end="url(#al)"/><path d="M870 362 1130 362" stroke="#3578e5" stroke-width="2.5" fill="none" marker-end="url(#ar)"/><text x="60" y="396" class="e">More handled by your application</text><text x="1140" y="396" class="e" text-anchor="end">More handled by Microsoft services</text><text x="60" y="424" class="b">Direct control of model path, credentials,</text><text x="60" y="446" class="b">network boundary, and session recovery</text><text x="1140" y="424" class="b" text-anchor="end">Managed turn detection, orchestration,</text><text x="1140" y="446" class="b" text-anchor="end">grounding, and tool execution</text><text x="40" y="490" class="s">Moving left reduces managed features and increases control; moving right reduces implementation effort.</text></svg>
