<svg xmlns="http://www.w3.org/2000/svg" width="1400" height="720" viewBox="0 0 1400 720" role="img" aria-labelledby="title desc">
  <title id="title">Authenticated tool paths differ by credential custody</title>
  <desc id="desc">Backend functions keep credentials and private reachability in the application, while native MCP passes authorization through a managed service to a service-reachable endpoint.</desc>
  <defs>
    <linearGradient id="bg" x1="0" y1="0" x2="1" y2="1">
      <stop offset="0" stop-color="#f7fbff"/>
      <stop offset="1" stop-color="#f7f5ff"/>
    </linearGradient>
    <filter id="shadow" x="-20%" y="-20%" width="140%" height="150%">
      <feDropShadow dx="0" dy="7" stdDeviation="10" flood-color="#17324d" flood-opacity=".12"/>
    </filter>
    <marker id="arrowGreen" viewBox="0 0 10 10" refX="9" refY="5" markerWidth="8" markerHeight="8" orient="auto">
      <path d="M0 0 10 5 0 10z" fill="#168466"/>
    </marker>
    <marker id="arrowPurple" viewBox="0 0 10 10" refX="9" refY="5" markerWidth="8" markerHeight="8" orient="auto">
      <path d="M0 0 10 5 0 10z" fill="#7357e5"/>
    </marker>
    <style>
      .title{font:700 31px 'Segoe UI',Arial,sans-serif;fill:#132238}
      .sub{font:15px 'Segoe UI',Arial,sans-serif;fill:#4b6178}
      .lane{font:700 13px 'Segoe UI',Arial,sans-serif;letter-spacing:1px;fill:#536981}
      .step{font:700 11px 'Segoe UI',Arial,sans-serif;letter-spacing:.8px;fill:#536981}
      .cardTitle{font:700 18px 'Segoe UI',Arial,sans-serif;fill:#132238}
      .body{font:14px 'Segoe UI',Arial,sans-serif;fill:#40566d}
      .label{font:600 12px 'Segoe UI',Arial,sans-serif;fill:#486078}
      .rule{font:600 14px 'Segoe UI',Arial,sans-serif;fill:#18364f}
      .warning{font:600 14px 'Segoe UI',Arial,sans-serif;fill:#6d3c00}
    </style>
  </defs>

  <rect width="1400" height="720" fill="url(#bg)"/>
  <circle cx="1315" cy="30" r="105" fill="#7357e5" opacity=".06"/>
  <text x="56" y="52" class="title">Authenticated tools: choose where credentials live</text>
  <text x="56" y="82" class="sub">Function calling and native MCP can expose the same capability, but they create different trust boundaries.</text>

  <rect x="40" y="130" width="1320" height="230" rx="24" fill="#fff" opacity=".7" stroke="#8ccbb8" stroke-width="1.5"/>
  <text x="64" y="162" class="lane">PATH A · BACKEND FUNCTION</text>

  <g filter="url(#shadow)">
    <rect x="64" y="195" width="250" height="125" rx="18" fill="#e8f3fd" stroke="#5ba3dd" stroke-width="2"/>
    <text x="88" y="226" class="step">MODEL</text>
    <text x="88" y="260" class="cardTitle">Requests a function</text>
    <text x="88" y="288" class="body">No credential in the model</text>
  </g>
  <g filter="url(#shadow)">
    <rect x="414" y="180" width="340" height="155" rx="18" fill="#e9f8f1" stroke="#4dad88" stroke-width="2"/>
    <text x="438" y="211" class="step">YOUR APPLICATION</text>
    <text x="438" y="245" class="cardTitle">Backend policy + execution</text>
    <text x="438" y="276" class="body">Authorize the user and action</text>
    <text x="438" y="304" class="body">Credential stays in your backend</text>
  </g>
  <g filter="url(#shadow)">
    <rect x="854" y="195" width="280" height="125" rx="18" fill="#e6f7fb" stroke="#42a4bd" stroke-width="2"/>
    <text x="878" y="226" class="step">PRIVATE TOOL</text>
    <text x="878" y="260" class="cardTitle">Internal API or MCP</text>
    <text x="878" y="288" class="body">Reachable from the backend</text>
  </g>
  <rect x="1170" y="195" width="166" height="125" rx="18" fill="#eef8f2" stroke="#4dad88" stroke-width="1.5"/>
  <text x="1190" y="228" class="step">BEST FOR</text>
  <text x="1190" y="260" class="body">Sensitive actions</text>
  <text x="1190" y="286" class="body">Private endpoints</text>

  <path d="M314 257H414" stroke="#168466" stroke-width="3" fill="none" marker-end="url(#arrowGreen)"/>
  <path d="M754 257H854" stroke="#168466" stroke-width="3" fill="none" marker-end="url(#arrowGreen)"/>
  <text x="364" y="242" text-anchor="middle" class="label">function call</text>
  <text x="804" y="242" text-anchor="middle" class="label">authorized call</text>

  <rect x="40" y="390" width="1320" height="250" rx="24" fill="#fff" opacity=".7" stroke="#c6b6ed" stroke-width="1.5"/>
  <text x="64" y="422" class="lane">PATH B · NATIVE MCP</text>

  <g filter="url(#shadow)">
    <rect x="64" y="460" width="250" height="125" rx="18" fill="#e8f3fd" stroke="#5ba3dd" stroke-width="2"/>
    <text x="88" y="491" class="step">MODEL</text>
    <text x="88" y="525" class="cardTitle">Requests an MCP tool</text>
    <text x="88" y="553" class="body">Tool selected by schema</text>
  </g>
  <g filter="url(#shadow)">
    <rect x="414" y="445" width="340" height="155" rx="18" fill="#f1eafd" stroke="#8561bc" stroke-width="2"/>
    <text x="438" y="476" class="step">MANAGED SERVICE</text>
    <text x="438" y="510" class="cardTitle">Discovers + executes</text>
    <text x="438" y="541" class="body">Voice Live or Agent Service</text>
    <text x="438" y="569" class="body">Applies the approval policy</text>
  </g>
  <g filter="url(#shadow)">
    <rect x="854" y="460" width="280" height="125" rx="18" fill="#fff5dd" stroke="#e5a23c" stroke-width="2"/>
    <text x="878" y="491" class="step">MCP ENDPOINT</text>
    <text x="878" y="525" class="cardTitle">Service-reachable</text>
    <text x="878" y="553" class="body">Receives forwarded authorization</text>
  </g>
  <rect x="1170" y="445" width="166" height="155" rx="18" fill="#fdecee" stroke="#d65a5e" stroke-width="1.5"/>
  <text x="1190" y="476" class="step">REVIEW</text>
  <text x="1190" y="510" class="body">Credential crosses</text>
  <text x="1190" y="536" class="body">a service boundary</text>
  <text x="1190" y="570" class="body">Endpoint exposure</text>

  <path d="M314 522H414" stroke="#7357e5" stroke-width="3" fill="none" marker-end="url(#arrowPurple)"/>
  <path d="M754 522H854" stroke="#7357e5" stroke-width="3" fill="none" marker-end="url(#arrowPurple)"/>
  <text x="364" y="507" text-anchor="middle" class="label">tool request</text>
  <text x="804" y="507" text-anchor="middle" class="label">service call</text>

  <rect x="56" y="665" width="1280" height="36" rx="12" fill="#eef4ff" stroke="#c8d8ef"/>
  <text x="78" y="688" class="rule">Choose backend functions when private reachability or credential custody is the hard gate; choose native MCP when managed discovery is worth the service boundary.</text>
</svg>
