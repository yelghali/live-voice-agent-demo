<svg xmlns="http://www.w3.org/2000/svg" width="1200" height="730" viewBox="0 0 1200 730" role="img" aria-labelledby="title desc">
  <title id="title">Microsoft Foundry voice agent enterprise responsibility boundary</title>
  <desc id="desc">Channels connect to the managed Foundry voice runtime and agent runtime, which use either a native speech model or a cascaded speech and text model path. Enterprise knowledge, tools, identities, telemetry, and retained conversations remain separate governance boundaries.</desc>
  <defs>
    <marker id="arrow-blue" viewBox="0 0 10 10" refX="9" refY="5" markerWidth="7" markerHeight="7" orient="auto-start-reverse">
      <path d="M 0 0 L 10 5 L 0 10 z" fill="#0078D4"/>
    </marker>
    <marker id="arrow-purple" viewBox="0 0 10 10" refX="9" refY="5" markerWidth="7" markerHeight="7" orient="auto-start-reverse">
      <path d="M 0 0 L 10 5 L 0 10 z" fill="#5C2D91"/>
    </marker>
    <style>
      .title { font: 700 30px "Segoe UI", sans-serif; fill: #111; }
      .heading { font: 600 20px "Segoe UI", sans-serif; fill: #111; }
      .body { font: 18px "Segoe UI", sans-serif; fill: #111; }
      .small { font: 16px "Segoe UI", sans-serif; fill: #333; }
      .container { fill: none; stroke-width: 2.5; rx: 14; }
      .leaf { stroke-width: 1.5; rx: 10; }
      .flow { fill: none; stroke-width: 2.5; }
    </style>
  </defs>

  <rect width="1200" height="760" fill="#fff"/>
  <text x="600" y="45" text-anchor="middle" class="title">Microsoft Foundry voice agent: enterprise responsibility boundary</text>

  <rect x="35" y="105" width="220" height="365" class="container" stroke="#0C8599"/>
  <text x="145" y="140" text-anchor="middle" class="heading">Channels</text>
  <rect x="70" y="190" width="150" height="80" class="leaf" stroke="#0C8599" fill="#99E9F2"/>
  <text x="145" y="225" text-anchor="middle" class="body">Browser or</text>
  <text x="145" y="248" text-anchor="middle" class="body">custom client</text>
  <rect x="70" y="325" width="150" height="90" class="leaf" stroke="#0C8599" fill="#99E9F2"/>
  <text x="145" y="362" text-anchor="middle" class="body">Teams Phone</text>
  <text x="145" y="385" text-anchor="middle" class="body">or Twilio</text>

  <rect x="305" y="80" width="565" height="445" class="container" stroke="#0078D4"/>
  <text x="588" y="115" text-anchor="middle" class="heading">Managed by Microsoft Foundry</text>
  <rect x="350" y="175" width="190" height="110" class="leaf" stroke="#0078D4" fill="#CFE4FA"/>
  <text x="445" y="207" text-anchor="middle" class="body">Voice runtime</text>
  <text x="445" y="232" text-anchor="middle" class="small">turn detection,</text>
  <text x="445" y="252" text-anchor="middle" class="small">audio streaming</text>
  <rect x="610" y="175" width="215" height="110" class="leaf" stroke="#107C10" fill="#DFF6DD"/>
  <text x="718" y="207" text-anchor="middle" class="body">Agent runtime</text>
  <text x="718" y="232" text-anchor="middle" class="small">instructions, tools,</text>
  <text x="718" y="252" text-anchor="middle" class="small">versions, policy</text>
  <rect x="400" y="340" width="375" height="135" class="leaf" stroke="#5C2D91" fill="#E8DAEF"/>
  <text x="588" y="372" text-anchor="middle" class="body">Selected model path</text>
  <text x="588" y="397" text-anchor="middle" class="small">native speech-to-speech</text>
  <text x="588" y="420" text-anchor="middle" class="small">or speech recognition -&gt; text model</text>
  <text x="588" y="443" text-anchor="middle" class="small">-&gt; speech synthesis</text>

  <rect x="920" y="105" width="245" height="365" class="container" stroke="#5C2D91"/>
  <text x="1043" y="140" text-anchor="middle" class="heading">Enterprise controls</text>
  <rect x="955" y="190" width="175" height="80" class="leaf" stroke="#5C2D91" fill="#E8DAEF"/>
  <text x="1043" y="225" text-anchor="middle" class="body">Knowledge and</text>
  <text x="1043" y="248" text-anchor="middle" class="body">user entitlements</text>
  <rect x="955" y="325" width="175" height="90" class="leaf" stroke="#D13438" fill="#FDE7E9"/>
  <text x="1043" y="352" text-anchor="middle" class="body">Tools and actions</text>
  <text x="1043" y="375" text-anchor="middle" class="small">access roles, user</text>
  <text x="1043" y="395" text-anchor="middle" class="small">delegation, approval</text>

  <rect x="305" y="585" width="565" height="125" class="container" stroke="#495057"/>
  <text x="588" y="620" text-anchor="middle" class="heading">Operations and data retention</text>
  <text x="588" y="650" text-anchor="middle" class="body">Application Insights, traces, evaluations,</text>
  <text x="588" y="675" text-anchor="middle" class="body">optional transcripts and audio</text>

  <path d="M255 230 H350" class="flow" stroke="#0078D4" marker-end="url(#arrow-blue)"/>
  <text x="302" y="215" text-anchor="middle" class="small">audio session</text>
  <path d="M540 230 H610" class="flow" stroke="#0078D4" marker-end="url(#arrow-blue)"/>
  <path d="M718 285 C718 315 670 330 630 350" class="flow" stroke="#5C2D91" marker-end="url(#arrow-purple)"/>
  <path d="M825 230 H955" class="flow" stroke="#5C2D91" marker-end="url(#arrow-purple)"/>
  <text x="890" y="215" text-anchor="middle" class="small">retrieval and tools</text>
  <path d="M588 525 V585" class="flow" stroke="#495057" marker-end="url(#arrow-blue)"/>
  <text x="600" y="558" class="small">telemetry and optional storage</text>

</svg>
